# Kit-owned (adlc init). Trims Serena to the 10 tools in the contract allowlist.
# Copilot CLI ignores the .mcp.json `tools` filter today, so this file is the enforcement.
description: ADLC context for GitHub Copilot CLI — symbol tools only; files/shell/memory writes are Copilot's job
prompt: |
  You are running inside GitHub Copilot CLI. File reads, greps, edits and shell commands are
  handled by Copilot's own tools. Use Serena only for symbol-precise work: finding symbols
  and their references/implementations, symbol-scoped edits, diagnostics, and reading the
  committed project memories. Avoid reading whole files when a symbol query will do.
excluded_tools:
  - activate_project
  - create_text_file
  - delete_lines
  - delete_memory
  - edit_memory
  - execute_shell_command
  - find_declaration
  - find_file
  - get_current_config
  - get_diagnostics_for_symbol
  - initial_instructions
  - insert_at_line
  - list_dir
  - list_queryable_projects
  - onboarding
  - open_dashboard
  - query_project
  - read_file
  - remove_project
  - rename_memory
  - rename_symbol
  - replace_content
  - replace_in_files
  - replace_lines
  - restart_language_server
  - safe_delete_symbol
  - search_for_pattern
  - serena_info
  - serena_repl
  - write_memory
tool_description_overrides: {}
single_project: true
